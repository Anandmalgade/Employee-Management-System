
<table border="1">
        <tr>
        <th>ID</th>
        <th>firstName</th>
        <th>LastName</th>
        <th>Email</th>
       </tr>
       @for(employee of employees;track employee.id){
       <tr>
              <td>{{employee.id}}</td>
              <td>{{employee.firstName}}</td>
              <td>{{employee.lastName}}</td>
              <td>{{employee.email}}</td>
          
       </tr>

    }

</table>

<button routerLink="/employeeform">Add Employee</button>
